invariants:
  - id: EVG-I1
    text: No status may advance without explicit evidence supporting that transition.
  - id: EVG-I2
    text: Silence never advances a status.
  - id: EVG-I3
    text: SENT, ACKNOWLEDGED, and ROUTED must not be represented as endorsement or validation.
  - id: EVG-I4
    text: VALIDATED requires explicit external evidence and a reproducible artifact link.
  - id: EVG-I5
    text: A counterexample that narrows or changes the claim increases review value even if it lowers apparent confidence.

proofpath_mapping:
