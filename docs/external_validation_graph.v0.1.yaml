schema_version: external-validation-graph/v0.1
updated_at: 2026-08-09
project: LiminalOSAI
related_projects:
  - LiminalDB

claim:
  id: PSAG-001
  text: >-
    A sandbox escape should not automatically become durable permission for an
    agent to continue accumulating and exercising authority.
  scope: post-sandbox authority accumulation and governed external effects
  nonclaims:
    - does not claim to prevent sandbox escape itself
    - does not claim universal agent safety
    - does not treat outreach, acknowledgement, or routing as validation

status_model:
  SENT:
    weight: 0.05
    meaning: Review material was sent to a relevant external target.
  ACKNOWLEDGED:
    weight: 0.10
    meaning: Receipt or intake was acknowledged; technical review is not confirmed.
  ROUTED:
    weight: 0.20
    meaning: The recipient explicitly stated that material was passed internally for review.
  TECHNICAL_FEEDBACK:
    weight: 0.40
    meaning: Substantive technical feedback or a counterexample was received.
  REPRODUCED:
    weight: 0.75
    meaning: An external reviewer independently reproduced a test, failure trace, or benchmark result.
  VALIDATED:
    weight: 1.00
    meaning: Explicit evidence-backed external validation. Not currently claimed.

weighting_note: >-
  Weights are conservative operational weights for the maturity of the external
  review trail. They are not probabilities, safety-confidence estimates,
  endorsements, or scientific effect sizes. A sent email contributes only a
  small amount of weight; independent reproduction contributes substantially more.

score:
  id: EEW-v0.1
  name: External Evidence Weight
  formula: 100 * sum(target.status_weight) / count(targets)
  target_count: 7
  weighted_sum: 0.55
  score_percent: 7.86
  interpretation: >-
    External review outreach exists and one target has explicitly routed the work,
    but no external reproduction or validation is currently recorded.

allowed_transitions:
  - from: SENT
    to: ACKNOWLEDGED
    evidence_required: explicit acknowledgement of receipt or intake
  - from: SENT
    to: TECHNICAL_FEEDBACK
    evidence_required: direct substantive technical response
  - from: ACKNOWLEDGED
    to: ROUTED
    evidence_required: explicit statement of internal routing
  - from: ACKNOWLEDGED
    to: TECHNICAL_FEEDBACK
    evidence_required: substantive technical response
  - from: ROUTED
    to: TECHNICAL_FEEDBACK
    evidence_required: substantive technical response or counterexample
  - from: TECHNICAL_FEEDBACK
    to: REPRODUCED
    evidence_required: independent reproduction of a linked trace or benchmark
  - from: REPRODUCED
    to: VALIDATED
    evidence_required: explicit evidence-backed validation with reproducible artifact linkage

