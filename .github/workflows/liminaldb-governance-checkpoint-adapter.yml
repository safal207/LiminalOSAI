name: LiminalDB Governance Checkpoint Adapter

on:
  pull_request:
    paths:
      - 'sdk/liminal_liminaldb_governance_checkpoint/**'
      - 'sdk/liminal_durable_governance_fence/**'
      - 'sdk/liminal_effect_commit/**'
      - 'sdk/liminal_post_sandbox_contracts/**'
      - 'tests/test_liminaldb_governance_checkpoint_adapter.py'
      - 'tests/test_durable_governance_commit_fence.py'
      - 'docs/LIMINALDB_GOVERNANCE_CHECKPOINT_ADAPTER.md'
      - '.github/workflows/liminaldb-governance-checkpoint-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LiminalOSAI exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned LiminalDB bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: safal207/LiminalDB
          ref: 0cd6e77d52787bb36a97b75ba1a37cb027268eb3
          path: _liminaldb
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: _liminaldb/liminal-db

      - name: Record exact heads
        run: |
          echo "LiminalOSAI=${GITHUB_SHA}"
          echo "LiminalDB=$(git -C _liminaldb rev-parse HEAD)"
          test "$(git -C _liminaldb rev-parse HEAD)" = "0cd6e77d52787bb36a97b75ba1a37cb027268eb3"

      - name: Run checkpoint adapter tests
        run: python3 -m unittest tests/test_liminaldb_governance_checkpoint_adapter.py -v

      - name: Re-run durable governance tests
        run: python3 -m unittest tests/test_durable_governance_commit_fence.py -v

      - name: Build pinned native bridge
        run: cargo build -q --locked --manifest-path _liminaldb/liminal-db/Cargo.toml -p liminal-store --example liminalosai_governance_checkpoint_bridge

      - name: Cross-repo native bridge conformance
        env:
          LIMINALDB_TEST_SIGNING_SEED_HEX: '0707070707070707070707070707070707070707070707070707070707070707'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          from sdk.liminal_durable_governance_fence import GovernanceWorld, SQLiteGovernanceStore
          from sdk.liminal_liminaldb_governance_checkpoint import CheckpointingGovernanceStore, SQLiteCheckpointMirrorJournal

          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              primary = SQLiteGovernanceStore(str(base / 'primary.sqlite'))
              journal = SQLiteCheckpointMirrorJournal(str(base / 'mirror.sqlite'))
              ledger_root = base / 'liminaldb-ledger'
              binary = Path('_liminaldb/liminal-db/target/debug/examples/liminalosai_governance_checkpoint_bridge').resolve()

              def bridge(envelope, timeout_seconds):
                  env = dict(os.environ)
                  env['LIMINALDB_CHECKPOINT_ISSUED_AT_MS'] = str(envelope['captured_at_ms'] + 1)
                  proc = subprocess.run(
                      [str(binary), str(ledger_root)],
                      input=json.dumps(envelope), text=True, capture_output=True,
                      env=env, check=True, timeout=timeout_seconds,
                  )
                  return json.loads(proc.stdout)

              ticks = iter([10, 20])
              store = CheckpointingGovernanceStore(
                  delegate=primary,
                  journal=journal,
                  bridge=bridge,
                  bridge_timeout_seconds=30.0,
                  clock_ms=lambda: next(ticks),
                  pinned_trusted_keys=({
                      'signer_id': 'liminalosai-governance-bridge',
                      'key_id': 'conformance-key-v0.1',
                      'public_key_hex': 'ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c',
                  },),
              )
              root = 'governance:cross-repo'
              first_world = GovernanceWorld.build(
                  objective_state_sha256='1' * 64,
                  causal_state_sha256='2' * 64,
                  runtime_context_sha256='3' * 64,
              )
              first = store.initialize(root_id=root, world=first_world.as_document())
              assert first['generation'] == 0
              assert store.mirror_state_document(root_id=root)['status'] == 'CLEAR'

              second_world = GovernanceWorld.build(
                  objective_state_sha256='4' * 64,
                  causal_state_sha256='5' * 64,
                  runtime_context_sha256='6' * 64,
              )
              second = store.mutate_world(
                  root_id=root,
                  expected_generation=first['generation'],
                  expected_world_sha256=first['world_sha256'],
                  new_world=second_world.as_document(),
                  transition_receipt_sha256='7' * 64,
              )
              assert second['generation'] == 1
              mirror = store.mirror_state_document(root_id=root)
              assert mirror['status'] == 'CLEAR'
              assert mirror['sequence'] == 2
              history = journal.history(root_id=root)
              assert [item['event_kind'] for item in history] == ['PENDING','ACKED','PENDING','ACKED']
              assert len(list(ledger_root.glob('**/*'))) > 0
          PY

      - name: Re-run causal/objective/effect security stack
        run: |
          python3 -m unittest tests/test_causal_bound_effect_commit.py -v
          python3 -m unittest tests/test_objective_bound_effect_commit.py -v
          python3 -m unittest tests/test_epoch_bound_effect_commit.py -v
          python3 -m unittest tests/test_epoch_bound_capability.py -v
          python3 -m unittest tests/test_objective_integrity_guard.py -v
          python3 -m unittest tests/test_causal_escalation_phase3.py -v

      - name: Re-run runtime and containment stack
        run: |
          python3 -m unittest tests/test_bound_runtime_config_broker.py -v
          python3 -m unittest tests/test_runtime_mediation_v1_3.py -v
          python3 -m unittest tests/test_containment_phase4.py -v
          python3 -m unittest tests/test_process_tree_active_containment.py -v
          python3 -m unittest tests/test_isolated_execution_broker.py -v
          python3 -m unittest tests/test_bound_package_install_broker.py -v
          python3 -m unittest tests/test_offline_wheel_materializer.py -v
          python3 -m unittest tests/test_escape_trajectory_benchmark_v1.py -v

      - name: Run full repository regression
        run: make test

      - name: Verify authority boundary
        run: |
          python3 - <<'PY'
          from sdk.liminal_liminaldb_governance_checkpoint import AUTHORITY
          assert AUTHORITY['checkpoint_evidence_only'] is True
          assert AUTHORITY['pending_before_primary_mutation'] is True
          assert AUTHORITY['fail_closed_on_bridge_failure'] is True
          assert AUTHORITY['explicit_mirror_reconciliation_required'] is True
          assert AUTHORITY['automatic_mirror_expiry'] is False
          assert AUTHORITY['bounded_bridge_timeout_required'] is True
          assert AUTHORITY['primary_cas_authority'] is False
          assert AUTHORITY['capability_grant'] is False
          assert AUTHORITY['runtime_mutation'] is False
          assert AUTHORITY['network_authority'] is False
          assert AUTHORITY['credential_authority'] is False
          assert AUTHORITY['distributed_consensus'] is False
          assert AUTHORITY['kernel_enforcement'] is False
          PY
