name: OpenAI-HF Escape Trajectory Benchmark v1

on:
  pull_request:
    paths:
      - 'sdk/liminal_escape_trajectory/**'
      - 'tests/test_escape_trajectory_benchmark_v1.py'
      - 'docs/OPENAI_HF_ESCAPE_TRAJECTORY_BENCHMARK_V1.md'
      - '.github/workflows/openai-hf-escape-trajectory-benchmark-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record exact head
        run: echo "${GITHUB_SHA}"
      - name: Run incident-inspired benchmark tests
        run: python3 -m unittest tests/test_escape_trajectory_benchmark_v1.py -v
      - name: Re-run causal escalation tests
        run: python3 -m unittest tests/test_causal_escalation_phase3.py -v
      - name: Re-run containment tests
        run: python3 -m unittest tests/test_containment_phase4.py -v
      - name: Re-run multi-agent governance tests
        run: python3 -m unittest tests/test_multi_agent_governance_v1_2.py -v
      - name: Run full repository regression
        run: make test
      - name: Verify benchmark acceptance invariants
        run: |
          python3 - <<'PY'
          from sdk.liminal_escape_trajectory import AUTHORITY, run_escape_trajectory

          report = run_escape_trajectory()
          assert report['passed'] is True
          assert report['first_non_allow']['stage_id'] == 'S5'
          assert report['first_non_allow']['decision'] == 'REVISE'
          assert report['final_decision']['decision'] == 'CONTAIN'
          assert report['containment_review'] is True
          assert report['replay_integrity'] is True
          assert report['cross_agent_authority_transfer']['blocked'] is True
          assert len(report['subjects']) >= 2
          assert AUTHORITY['live_exploitation'] is False
          assert AUTHORITY['external_network'] is False
          assert AUTHORITY['real_credential_access'] is False
          assert AUTHORITY['repository_mutation'] is False
          assert AUTHORITY['process_escape'] is False
          assert AUTHORITY['deployment'] is False
          assert AUTHORITY['automatic_release'] is False
          assert AUTHORITY['real_target_emulation'] is False
          print(report['report_sha256'])
          PY
