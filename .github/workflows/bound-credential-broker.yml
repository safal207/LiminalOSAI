name: Bound Credential Broker

on:
  pull_request:
    paths:
      - 'sdk/liminal_credential_broker/**'
      - 'adapters/credentials/**'
      - 'tests/test_bound_credential_broker.py'
      - 'docs/BOUND_CREDENTIAL_BROKER.md'
      - '.github/workflows/bound-credential-broker.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bound credential broker tests
        run: python3 -m unittest tests/test_bound_credential_broker.py -v

      - name: Re-run Capability Broker
        run: python3 -m unittest tests/test_capability_broker_phase1.py -v

      - name: Re-run Egress Gateway
        run: python3 -m unittest tests/test_egress_gateway_phase2.py -v

      - name: Re-run Causal Escalation
        run: python3 -m unittest tests/test_causal_escalation_phase3.py -v

      - name: Re-run Containment
        run: python3 -m unittest tests/test_containment_phase4.py -v

      - name: Re-run Runtime Mediation
        run: python3 -m unittest tests/test_runtime_mediation_v1_3.py -v

      - name: Re-run Isolated Execution Broker
        run: python3 -m unittest tests/test_isolated_execution_broker.py -v

      - name: Verify model-facing credential SDK has no host secret/execution imports
        run: |
          ! grep -R -nE '(^|[[:space:]])(import|from)[[:space:]]+(subprocess|socket|os|boto3|hvac)([[:space:].]|$)' sdk/liminal_credential_broker
          ! grep -R -nE '(get_secret_value|read_secret|vault_client|secretsmanager)' sdk/liminal_credential_broker

      - name: Verify trusted boundary remains explicit
        run: |
          python3 - <<'PY'
          from sdk.liminal_credential_broker import AUTHORITY as BROKER_AUTHORITY
          from adapters.credentials.liminal_credential_injector import AUTHORITY as INJECTOR_AUTHORITY
          assert BROKER_AUTHORITY['secret_provider_access'] is False
          assert BROKER_AUTHORITY['secret_material_export'] is False
          assert BROKER_AUTHORITY['network_authority'] is False
          assert INJECTOR_AUTHORITY['secret_provider_access'] is True
          assert INJECTOR_AUTHORITY['secret_material_export'] is False
          assert INJECTOR_AUTHORITY['network_authority'] is False
          PY

      - name: Build production kernel fixture
        run: make

      - name: Run full repository regression
        run: python3 -m unittest discover -s tests -p 'test_*.py'
