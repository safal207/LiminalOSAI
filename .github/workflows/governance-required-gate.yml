name: LiminalOSAI Governance Required Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liminalos-governance-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance-gate:
    name: Governance Required Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record validation subject
        run: |
          git rev-parse HEAD
          echo "event-sha ${GITHUB_SHA}"
          echo "pull-request-head ${{ github.event.pull_request.head.sha }}"

      - name: Complete repository baseline
        run: make validate

      - name: Declared gate scope
        run: |
          echo "This gate always runs for every pull request targeting main."
          echo "It builds both binaries, runs smoke checks, every C test and discovered Python regressions without skips."
          echo "Specialized compiler, sanitizer, Docker and evidence workflows retain their own checks."
          echo "Path-filtered workflows remain gated by their own paths filters and are intentionally not required checks."
