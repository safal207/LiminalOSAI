name: Epoch-Bound Effect Commit

on:
  pull_request:
    paths:
      - 'sdk/liminal_effect_commit/**'
      - 'sdk/liminal_epoch_bound_capability/**'
      - 'sdk/liminal_runtime_config/**'
      - 'sdk/liminal_runtime_mediation/**'
      - 'tests/test_epoch_bound_effect_commit.py'
      - 'tests/test_epoch_bound_capability.py'
      - 'tests/test_bound_runtime_config_broker.py'
      - 'tests/test_runtime_mediation_v1_3.py'
      - 'tests/test_process_tree_active_containment.py'
      - 'tests/test_isolated_execution_broker.py'
      - 'tests/test_bound_package_install_broker.py'
      - 'tests/test_offline_wheel_materializer.py'
      - 'tests/test_escape_trajectory_benchmark_v1.py'
      - 'docs/EPOCH_BOUND_EFFECT_COMMIT.md'
      - '.github/workflows/epoch-bound-effect-commit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record exact head
        run: echo "${GITHUB_SHA}"

      - name: Run epoch-bound effect commit tests
        run: python3 -m unittest tests/test_epoch_bound_effect_commit.py -v

      - name: Re-run epoch-bound capability tests
        run: python3 -m unittest tests/test_epoch_bound_capability.py -v

      - name: Re-run bound runtime configuration tests
        run: python3 -m unittest tests/test_bound_runtime_config_broker.py -v

      - name: Re-run runtime mediation tests
        run: python3 -m unittest tests/test_runtime_mediation_v1_3.py -v

      - name: Re-run containment and process-tree tests
        run: |
          python3 -m unittest tests/test_containment_phase4.py -v
          python3 -m unittest tests/test_process_tree_active_containment.py -v

      - name: Re-run isolated execution and package tests
        run: |
          python3 -m unittest tests/test_isolated_execution_broker.py -v
          python3 -m unittest tests/test_bound_package_install_broker.py -v
          python3 -m unittest tests/test_offline_wheel_materializer.py -v

      - name: Re-run escape trajectory benchmark
        run: python3 -m unittest tests/test_escape_trajectory_benchmark_v1.py -v

      - name: Run full repository regression
        run: make test

      - name: Verify authority boundary
        run: |
          python3 - <<'PY'
          from sdk.liminal_effect_commit import AUTHORITY
          assert AUTHORITY['effect_commit'] is True
          assert AUTHORITY['one_time_lease'] is True
          assert AUTHORITY['trusted_runtime_recheck'] is True
          assert AUTHORITY['trusted_session_recheck'] is True
          assert AUTHORITY['shared_runtime_commit_fence'] is True
          assert AUTHORITY['containment_gate'] is True
          assert AUTHORITY['capability_grant'] is False
          assert AUTHORITY['runtime_mutation'] is False
          assert AUTHORITY['secret_material_access'] is False
          assert AUTHORITY['network_authority'] is False
          assert AUTHORITY['kernel_enforcement'] is False
          PY
