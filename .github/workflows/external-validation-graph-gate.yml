name: External Validation Graph Gate

on:
  pull_request:
    paths:
      - 'docs/external_validation_graph.v0.1.yaml'
      - 'docs/EXTERNAL_VALIDATION_GRAPH.md'
      - 'docs/EXTERNAL_REVIEW_LEDGER.md'
      - 'docs/REVIEW_EVENT_ENVELOPE.md'
      - 'docs/review_event_envelope.v0.1.schema.json'
      - 'examples/review_events/**'
      - 'tools/validate_external_graph.py'
      - 'tools/validate_review_event.py'
      - 'tests/test_external_validation_graph.py'
      - 'tests/test_review_event_envelope.py'
      - '.github/workflows/external-validation-graph-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/external_validation_graph.v0.1.yaml'
      - 'docs/REVIEW_EVENT_ENVELOPE.md'
      - 'docs/review_event_envelope.v0.1.schema.json'
      - 'examples/review_events/**'
      - 'tools/validate_external_graph.py'
      - 'tools/validate_review_event.py'
      - 'tests/test_external_validation_graph.py'
      - 'tests/test_review_event_envelope.py'
      - '.github/workflows/external-validation-graph-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-external-evidence-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record exact head
        run: echo "${GITHUB_SHA}"

      - name: Validate canonical graph and recompute EEW
        run: python3 tools/validate_external_graph.py --json

      - name: Validate canonical review event examples
        run: |
          python3 tools/validate_review_event.py \
            examples/review_events/openai_routed.v0.1.json \
            examples/review_events/meta_sent.v0.1.json

      - name: Run graph-gate regression tests
        run: python3 -m unittest tests/test_external_validation_graph.py -v

      - name: Run review-event regression tests
        run: python3 -m unittest tests/test_review_event_envelope.py -v

      - name: State non-claim boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(Path('docs/external_validation_graph.v0.1.yaml').read_text())
          assert graph['score']['score_percent'] == 7.86
          assert all(t['status'] != 'VALIDATED' for t in graph['review_targets'])
          print('EEW is review maturity only; no external validation is currently claimed.')
          PY
